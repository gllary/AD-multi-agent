[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-tool-multi-agent"
version = "1.0.0"
description = "Safety-governed multi-agent pathway support for suspected acute aortic dissection before CTA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yuxia Guan" },
  { name = "Tuo Guo", email = "drgt96@csu.edu.cn" },
  { name = "Ying An", email = "anying@csu.edu.cn" },
  { name = "Linan Ren", email = "renlinan@csu.edu.cn" },
  { name = "Jianxin Wang" },
]
dependencies = [
  "pandas>=1.5",
  "jsonschema>=4.18",
]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[tool.setuptools.packages.find]
where = ["src"]
